<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open this case in Cortex</title>

  <!-- Rich preview when the link is shared in Messages / WhatsApp / Slack. -->
  <meta property="og:title" content="Can you solve this case?">
  <meta property="og:description" content="A real clinical case on Cortex — same patient, same clues, same pressure.">
  <meta property="og:type" content="website">

  <!-- Smart App Banner: if Cortex is installed, iOS offers to open it here too. -->
  <meta name="apple-itunes-app" content="app-id=6784620799">

  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #DCF4ED; color: #15233B; text-align: center; padding: 24px;
    }
    @media (prefers-color-scheme: dark) { body { background: #10203A; color: #F3F6FA; } }
    .card { max-width: 30rem; }
    h1 { font-size: 1.6rem; margin: 0 0 .5rem; }
    p  { color: #4A5A74; margin: 0 0 1.5rem; }
    @media (prefers-color-scheme: dark) { p { color: #A9B6CB; } }
    a.btn {
      display: inline-block; background: #F5803E; color: #fff; text-decoration: none;
      font-weight: 700; padding: 14px 28px; border-radius: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Open this case in Cortex</h1>
    <p>If you already have Cortex, this link opens the case straight in the app.
       Otherwise, grab it from the App Store — it's free to start.</p>
    <a class="btn" id="store" href="https://apps.apple.com/app/id6784620799">Get Cortex</a>
  </div>

  <script>
    // If iOS recognised the Universal Link it will have opened the app already and
    // this page never renders. Reaching here means Cortex isn't installed (or the
    // link was opened on desktop/Android), so send the visitor to the store.
    //
    // Only auto-redirect on iOS: on desktop we leave the page up so the link is
    // still readable/shareable rather than bouncing to an install page.
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
             || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) {
      setTimeout(function () {
        window.location.replace(document.getElementById('store').href);
      }, 700);
    }
  </script>
</body>
</html>
