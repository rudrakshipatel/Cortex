<!doctype html>
<!--
  Cortex deep-link redirect page.

  Host this so it answers BOTH:
    https://www.cortexcases.com/case/{id}
    https://www.cortexcases.com/invite/{code}

  It tries to open the Cortex app via the cortex:// scheme; if the app isn't
  installed, it falls back to the App Store / Play Store after a short delay.

  How to deploy depends on your host — the goal is that any /case/* and
  /invite/* path serves this same file. Examples:
    • Netlify/Vercel: add redirects so /case/:id and /invite/:code -> /redirect.html (200 rewrite).
    • Nginx: `location ~ ^/(case|invite)/ { try_files /redirect.html =404; }`
    • Static host: put this file at /case/index.html AND /invite/index.html.

  Replace the two store URLs below with your real App Store / Play Store links.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Cortex…</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #FCE7D6; color: #15233B; margin: 0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; }
    .card { padding: 32px 24px; max-width: 360px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p  { color: #4A5A74; font-size: 15px; }
    a.btn { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 14px;
            background: #F5803E; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Opening Cortex…</h1>
    <p>If the app doesn't open, we'll send you to download it.</p>
    <a class="btn" id="storeLink" href="#">Get Cortex</a>
  </div>

  <script>
    // ==== EDIT THESE TWO ====
    var APP_STORE_URL   = "https://apps.apple.com/app/idYOUR_APP_ID";
    var PLAY_STORE_URL  = "https://play.google.com/store/apps/details?id=com.docriddles.cortex";
    // ========================

    var path  = location.pathname.replace(/^\/+/, "").split("/");   // ["case","{id}"] or ["invite","{code}"]
    var kind  = (path[0] || "").toLowerCase();
    var value = path[1] || "";
    var appURL = (kind === "case" || kind === "invite") && value
      ? "cortex://" + kind + "/" + encodeURIComponent(value)
      : "cortex://";

    var isAndroid = /android/i.test(navigator.userAgent);
    var storeURL  = isAndroid ? PLAY_STORE_URL : APP_STORE_URL;
    document.getElementById("storeLink").href = storeURL;

    // Try to open the app; if we're still here after a moment, go to the store.
    var start = Date.now();
    var t = setTimeout(function () {
      if (Date.now() - start < 2000) location.href = storeURL;
    }, 1200);
    window.addEventListener("pagehide", function () { clearTimeout(t); });   // app opened
    window.location.href = appURL;
  </script>
</body>
</html>
